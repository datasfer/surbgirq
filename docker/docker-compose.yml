version: '3'
services:
  neo4j-docker:
    container_name: neo4j-lab
    image: neo4j-4-enterprise:latest
    # user: "1000:100" # Allow write access for neo4j
    environment:
      - NEO4J_dbms_memory_pagecache_size=2G
      - NEO4J_dbms_memory_heap_maxSize=4G
      - NEO4J_dbms_memory_heap_initialSize=512M
      - NEO4J_AUTH=neo4j/CHANGE_ME
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
   #   - NEO4JLABS_PLUGINS=["apoc", "n10s"] # "graphql",
    ports:
      - 7474:7474
      - 7687:7687
    volumes:
      - neo4j_data:/data
      - neo4j_data:/conf
      - neo4j_data:/import
      - neo4j_data:/plugin
volumes:
  neo4j_data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $HOME/haskell/surbgirq/data
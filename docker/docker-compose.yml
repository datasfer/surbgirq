version: '3'
services:
  neo4j-docker:
    container_name: neo
    image: neo4j:4.0.4-enterprise
    user: "1000:999" # Allow write access for neo4j
    environment:
      - NEO4J_dbms_memory_pagecache_size=2G
      - NEO4J_dbms_memory_heap_maxSize=4G
      - NEO4J_dbms_memory_heap_initialSize=512M
      - NEO4J_dbms_connector_https_advertised__address=0.0.0.0:7473 
      - NEO4J_dbms_connector_http_advertised__address=0.0.0.0:7474
      - NEO4J_dbms_connector_bolt_advertised__address=192.0.2.10:7687
#      - NEO4J_dbms_connector_bolt_advertised__address=0.0.0.0:7687
      - NEO4J_AUTH=neo4j/CHANGE_ME
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
#      - NEO4JLABS_PLUGINS=["apoc"] # , "n10s"] # "graphql",
    ports:
      - 7474:7474
      - 7687:7687
    volumes:
      - neo4j_data:/data
      - neo4j_conf:/conf
      - neo4j_data:/import
      - neo4j_data:/plugin
      - neo4j_data:/logs
volumes:
  neo4j_data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $HOME/surbgirq/data
  neo4j_conf:     
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $HOME/surbgirq/data/conf
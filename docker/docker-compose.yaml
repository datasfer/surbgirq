version: '3.8'
networks:
  neo4j_network:
services:
  neo4j-docker:
    container_name: neo
    hostname: neo4j
    image: neo4j:5.18.1-enterprise
    networks:
      - neo4j_network
    user: "1000:999" # Allow write access for neo4j
    environment:
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_AUTH=neo4j/CHANGE_ME # username/password
      - NEO4J_dbms_security_auth__minimum__password__length=1
      - NEO4J_server_memory_heap_initial__size=512M
      - NEO4J_server_memory_heap_max__size=4G
      - NEO4J_server_memory_pagecache_size=2G
      - NEO4J_dbms_connector_bolt_advertised__address=127.0.0.1:7687
    ports:
      - 7474:7474
      - 7687:7687
    volumes:
      # <host_source>:<container_destination>:<options>
      - neo4j_data:/data
      - neo4j_conf:/conf
      - neo4j_data:/import
      - neo4j_data:/plugin
      - neo4j_data:/logs
      - scripts:/scripts
      - csv_data:/csv_data
    restart: always
    healthcheck:
      test: wget http://localhost:7474 || exit 1
      interval: 1s
      timeout: 10s
      retries: 20
      start_period: 3s
volumes:
  neo4j_data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $HOME/neo4jDB
  neo4j_conf:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $HOME/neo4jDB/conf
  scripts:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $HOME/surbgirq/scripts
  csv_data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $HOME/scriptures/csv


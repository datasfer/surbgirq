server:
        # Where the verse explorer listens; 127.0.0.1 keeps it on this machine
        host: "_env:EXPLORER_HOST:127.0.0.1"
        port: _env:EXPLORER_PORT:8009
        detailedRequestLogging: true
        ipFromHeader: true
        staticDir: "_env:EXPLORER_STATIC_PATH:../surbgirq-web/verse-explorer/front/"
# surbgirq-graph-api's root, without /api (the routes add it)
graphApiUrl: "_env:GRAPH_API_URL:http://localhost:33010"
# The Bible whose books the front page lists: an ID such as v1805-T or e1994-T (docs/bot.md)
defaultBible: "_env:EXPLORER_DEFAULT_BIBLE:v1805-T"

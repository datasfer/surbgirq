server:
      host: "_env:BACKEND_LISTEN_HOST:*"
      port: _env:BACKEND_LISTEN_PORT:33001
      detailedRequestLogging: true
      ipFromHeader: true
      staticDir: "_env:STATIC_PATH:../front/static"
      newsDir: "_env:NEWS_PATH:../front/static/news"
      runMode: _env:BACKEND_RUN_MODE:NoAuth
localNeo4jApi:
      baseUrl: "127.0.0.1"
      port: 33011
logs:
  logFiles :
    - type      : "ScribeJSON"
      path      : "logs/web.log"
      severity  : "Debug"
      verbosity : "V2"
  hostnameSuffix: "-expl"
  clusterId     : "stand"
stores:
  neo4j:
    user: neo4j
    pass: CHANGE_ME
  sqlite:
    dbName: "db/subgirq"
services:
  sms:
   apiUrl: "rest.nexmo.com"
   apiKey: "-"
   apiSecret: "-"
  email:
   senderEmail: "no-repy@surbgirq.com"
   senderName: "-"
   emailSubject: "-"
   apiHost: "api.sendgrid.com"
   apiUrl:  "https://api.sendgrid.com/v3/mail/send"
   apiKey:  "-"
   apiSecret: "-"

  description:
        "Յաշխատասիրութենէ տեառն Հ. Յովհաննու Զօհրապեան վարդապետի: Տպագրեալ հրամանաւ Տ.Տ. Ստեփաննոսի Ագոնց աստուածապատիւ արհիեպիսկոպոսի եւ առաջնորդի ուխտին սրբոյն Ղազարու։"
